name: Attach TestFlight Build

on:
  workflow_run:
    workflows: ["TestFlight Deploy"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/attach-testflight.yml"

permissions:
  contents: read

jobs:
  attach:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      WORKFLOW_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      APP_ID: "6809853034"
      BETA_GROUP_ID: "2acd0101-0920-4a97-9691-de3931fd491b"
      BETA_GROUP_NAME: "Maroowell Test"

    steps:
      - name: Normalize App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          RAW_KEY_PATH="$RUNNER_TEMP/AuthKey_raw.p8"
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          export RAW_KEY_PATH KEY_PATH
          python3 - <<'PY'
          import os
          from pathlib import Path

          raw = os.environ["APPSTORE_PRIVATE_KEY"].strip()
          raw = raw.replace("\\n", "\n").replace("\r", "")
          raw = raw.strip().strip('"').strip("'").strip()
          if "-----BEGIN PRIVATE KEY-----" not in raw and "-----BEGIN EC PRIVATE KEY-----" not in raw:
              body = "".join(raw.split())
              raw = f"-----BEGIN PRIVATE KEY-----\n{body}\n-----END PRIVATE KEY-----\n"
          elif not raw.endswith("\n"):
              raw += "\n"
          Path(os.environ["RAW_KEY_PATH"]).write_text(raw, encoding="utf-8")
          PY
          chmod 600 "$RAW_KEY_PATH"
          openssl pkey -in "$RAW_KEY_PATH" -noout >/dev/null
          openssl pkcs8 -topk8 -nocrypt -in "$RAW_KEY_PATH" -out "$KEY_PATH" >/dev/null 2>&1
          chmod 600 "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -noout >/dev/null

      - name: Attach uploaded build to internal TestFlight group
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TESTFLIGHT_BUILD_NUMBER="21"
          else
            TESTFLIGHT_BUILD_NUMBER="$WORKFLOW_RUN_NUMBER"
          fi
          export TESTFLIGHT_BUILD_NUMBER
          export APPSTORE_PRIVATE_KEY_FILE="$RUNNER_TEMP/AuthKey.p8"

          cat > "$RUNNER_TEMP/attach-testflight.mjs" <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const keyId = process.env.APPSTORE_KEY_ID;
          const issuerId = process.env.APPSTORE_ISSUER_ID;
          const appId = process.env.APP_ID;
          const groupId = process.env.BETA_GROUP_ID;
          const groupName = process.env.BETA_GROUP_NAME;
          const buildNumber = process.env.TESTFLIGHT_BUILD_NUMBER;
          const pem = fs.readFileSync(process.env.APPSTORE_PRIVATE_KEY_FILE, 'utf8');

          const enc = (value) => Buffer.from(
            typeof value === 'string' ? value : JSON.stringify(value)
          ).toString('base64url');

          const now = Math.floor(Date.now() / 1000);
          const header = enc({ alg: 'ES256', kid: keyId, typ: 'JWT' });
          const payload = enc({
            iss: issuerId,
            iat: now - 30,
            exp: now + 900,
            aud: 'appstoreconnect-v1'
          });
          const signingInput = `${header}.${payload}`;
          const signature = crypto.sign('sha256', Buffer.from(signingInput), {
            key: pem,
            dsaEncoding: 'ieee-p1363'
          }).toString('base64url');
          const token = `${signingInput}.${signature}`;

          async function request(path, options = {}) {
            const response = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                ...(options.body ? { 'Content-Type': 'application/json' } : {}),
                ...(options.headers || {})
              }
            });
            const text = await response.text();
            if (!response.ok) {
              const error = new Error(`ASC HTTP ${response.status}: ${text}`);
              error.status = response.status;
              throw error;
            }
            return text ? JSON.parse(text) : null;
          }

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let build = null;

          for (let attempt = 1; attempt <= 40; attempt++) {
            const builds = await request(
              `/v1/builds?filter[app]=${encodeURIComponent(appId)}&filter[version]=${encodeURIComponent(buildNumber)}&limit=20`
            );
            build = builds?.data?.find((item) => item.attributes?.version === buildNumber) ?? null;

            if (build?.attributes?.processingState === 'VALID') break;
            if (build?.attributes?.processingState === 'FAILED') {
              throw new Error(`Build ${buildNumber} processing failed in App Store Connect`);
            }

            console.log(`Waiting for build ${buildNumber} processing (${attempt}/40)...`);
            await sleep(15000);
          }

          if (!build) throw new Error(`Build ${buildNumber} did not appear in App Store Connect`);
          if (build.attributes?.processingState !== 'VALID') {
            throw new Error(`Build ${buildNumber} is not VALID: ${build.attributes?.processingState ?? 'unknown'}`);
          }

          try {
            await request(`/v1/betaGroups/${groupId}/relationships/builds`, {
              method: 'POST',
              body: JSON.stringify({ data: [{ type: 'builds', id: build.id }] })
            });
            console.log(`Attached build ${buildNumber} to ${groupName}`);
          } catch (error) {
            if (error.status === 409) {
              console.log(`Build ${buildNumber} is already attached to ${groupName}`);
            } else {
              throw error;
            }
          }
          JS

          node "$RUNNER_TEMP/attach-testflight.mjs"
