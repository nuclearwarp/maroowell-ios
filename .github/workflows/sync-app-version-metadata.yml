name: Sync iOS app version metadata

on:
  push:
    branches: [main]
    paths:
      - 'project.yml'
      - '.github/workflows/sync-app-version-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Read iOS version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*\([^[:space:]]*\).*/\1/p' project.yml | head -n 1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*\([0-9][0-9]*\).*/\1/p' project.yml | head -n 1)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=maroowell-app-version-sync")
          TOKEN=$(printf '%s' "$RESPONSE" | jq -r '.value')
          test -n "$TOKEN"
          test "$TOKEN" != 'null'
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Publish iOS source version
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          set -euo pipefail
          jq -nc             --arg platform ios             --arg version "$VERSION_NAME"             --argjson build "$VERSION_CODE"             --arg commit "$GITHUB_SHA"             '{platform:$platform,version:$version,build:$build,commit:$commit}'             > /tmp/version.json

          curl -fSs -X POST             'https://rgqerimdxkthkcewqbbe.supabase.co/functions/v1/github-app-version-sync'             -H "Authorization: Bearer $OIDC_TOKEN"             -H 'Content-Type: application/json'             --data-binary @/tmp/version.json
