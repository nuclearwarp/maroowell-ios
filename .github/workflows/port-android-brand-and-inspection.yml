name: Port Android Brand and Inspection Fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/port-android-brand-and-inspection.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bring Android brand assets and patch iOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Maroowell/Resources Maroowell/UI

          curl -fL "https://raw.githubusercontent.com/nuclearwarp/maroowell-android/main/app/src/main/res/drawable-nodpi/maroowell_login_loading4.gif" \
            -o Maroowell/Resources/maroowell_login_loading4.gif
          curl -fL "https://raw.githubusercontent.com/nuclearwarp/maroowell-android/main/app/src/main/res/font/mungyeong_gamhong.ttf" \
            -o Maroowell/Resources/mungyeong_gamhong.ttf

          cat > Maroowell/UI/MaroowellBrandSupport.swift <<'SWIFT'
          import CoreGraphics
          import CoreText
          import ImageIO
          import SwiftUI
          import UIKit

          enum MaroowellBrandFont {
              private static let postScriptName: String? = {
                  guard let url = Bundle.main.url(forResource: "mungyeong_gamhong", withExtension: "ttf") else {
                      return nil
                  }
                  CTFontManagerRegisterFontsForURL(url as CFURL, .process, nil)
                  guard let provider = CGDataProvider(url: url as CFURL),
                        let font = CGFont(provider),
                        let name = font.postScriptName else {
                      return nil
                  }
                  return name as String
              }()

              static func font(size: CGFloat) -> Font {
                  guard let postScriptName else {
                      return .system(size: size, weight: .black, design: .rounded)
                  }
                  return .custom(postScriptName, size: size)
              }
          }

          struct MaroowellLoadingGIFView: UIViewRepresentable {
              let resourceName: String

              init(resourceName: String = "maroowell_login_loading4") {
                  self.resourceName = resourceName
              }

              func makeUIView(context: Context) -> UIImageView {
                  let imageView = UIImageView()
                  imageView.contentMode = .scaleAspectFit
                  imageView.clipsToBounds = false
                  imageView.backgroundColor = .clear
                  imageView.image = Self.animatedGIF(named: resourceName)
                  imageView.startAnimating()
                  return imageView
              }

              func updateUIView(_ uiView: UIImageView, context: Context) {
                  if uiView.image == nil {
                      uiView.image = Self.animatedGIF(named: resourceName)
                  }
                  if !uiView.isAnimating { uiView.startAnimating() }
              }

              private static func animatedGIF(named name: String) -> UIImage? {
                  guard let url = Bundle.main.url(forResource: name, withExtension: "gif"),
                        let source = CGImageSourceCreateWithURL(url as CFURL, nil) else { return nil }
                  let count = CGImageSourceGetCount(source)
                  guard count > 0 else { return nil }

                  var frames: [UIImage] = []
                  var duration: TimeInterval = 0
                  for index in 0..<count {
                      guard let cgImage = CGImageSourceCreateImageAtIndex(source, index, nil) else { continue }
                      frames.append(UIImage(cgImage: cgImage))
                      var delay: TimeInterval = 0.1
                      if let properties = CGImageSourceCopyPropertiesAtIndex(source, index, nil) as? [String: Any],
                         let gif = properties[kCGImagePropertyGIFDictionary as String] as? [String: Any] {
                          delay = (gif[kCGImagePropertyGIFUnclampedDelayTime as String] as? Double)
                              ?? (gif[kCGImagePropertyGIFDelayTime as String] as? Double)
                              ?? 0.1
                      }
                      duration += max(delay, 0.02)
                  }
                  guard !frames.isEmpty else { return nil }
                  if frames.count == 1 { return frames[0] }
                  return UIImage.animatedImage(with: frames, duration: max(duration, 0.1))
              }
          }
          SWIFT

          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Patch target not found: {label} in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          patch(
              'Maroowell/Home/HomeView.swift',
              '''                Text("마루웰")
                    .font(.headline.weight(.black))
                    .foregroundStyle(MaroowellTheme.deepYellow)''',
              '''                Text("MAROOWELL")
                    .font(MaroowellBrandFont.font(size: 17))
                    .tracking(1.35)
                    .foregroundStyle(Color(red: 1.0, green: 0.77, blue: 0.0))''',
              'home brand'
          )

          patch(
              'Maroowell/Auth/LoginView.swift',
              '''        .scrollDismissesKeyboard(.interactively)
        .background(Color.white)
        .sheet(isPresented: $showPrivacyPolicy) {''',
              '''        .scrollDismissesKeyboard(.interactively)
        .background(Color.white)
        .overlay {
            if sessionViewModel.isSigningIn {
                ZStack {
                    Color.white.ignoresSafeArea()
                    MaroowellLoadingGIFView()
                        .frame(width: 286, height: 286)
                        .accessibilityLabel("로그인 중")
                }
                .transition(.opacity)
                .zIndex(100)
                .allowsHitTesting(true)
            }
        }
        .animation(.easeInOut(duration: 0.16), value: sessionViewModel.isSigningIn)
        .sheet(isPresented: $showPrivacyPolicy) {''',
              'login loading overlay'
          )

          patch(
              'Maroowell/Auth/SessionViewModel.swift',
              '''    private let client = SupabaseService.shared.client

    init() {''',
              '''    private let client = SupabaseService.shared.client
    private let minimumLoginLoadingDuration: TimeInterval = 4.0

    init() {''',
              'login loading duration property'
          )
          patch(
              'Maroowell/Auth/SessionViewModel.swift',
              '''        isSigningIn = true
        errorMessage = nil
        defer { isSigningIn = false }

        do {''',
              '''        let loadingStartedAt = Date()
        isSigningIn = true
        errorMessage = nil
        defer { isSigningIn = false }

        do {''',
              'login loading start'
          )
          patch(
              'Maroowell/Auth/SessionViewModel.swift',
              '''            try await client.auth.signIn(
                email: email.trimmingCharacters(in: .whitespacesAndNewlines),
                password: password
            )
            session = try await makeValidatedSession()''',
              '''            try await client.auth.signIn(
                email: email.trimmingCharacters(in: .whitespacesAndNewlines),
                password: password
            )
            let validatedSession = try await makeValidatedSession()
            let remaining = minimumLoginLoadingDuration - Date().timeIntervalSince(loadingStartedAt)
            if remaining > 0 {
                try? await Task.sleep(nanoseconds: UInt64(remaining * 1_000_000_000))
            }
            session = validatedSession''',
              'login minimum loading time'
          )

          patch(
              'Maroowell/Inspection/DailyInspectionView.swift',
              '''        .onAppear {
            loadSelectedDay()
            profileCollapsed = profile.isComplete
        }
        .alert("마루웰", isPresented: $showMessage) {''',
              '''        .onAppear {
            profile = store.loadProfile()
            signature = store.loadSignature()
            loadSelectedDay()
            profileCollapsed = profile.isComplete
        }
        .onChange(of: profile) { _, newProfile in
            store.saveProfile(newProfile)
        }
        .onDisappear {
            store.saveProfile(profile)
        }
        .alert("마루웰", isPresented: $showMessage) {''',
              'inspection profile reload/autosave'
          )

          patch(
              'Maroowell/Inspection/DatedDailyInspectionView.swift',
              '''        .navigationBarTitleDisplayMode(.inline)
        .onAppear { load() }
        .alert("마루웰", isPresented: $showMessage) {''',
              '''        .navigationBarTitleDisplayMode(.inline)
        .onAppear { load() }
        .onChange(of: profile) { _, newProfile in
            store.saveProfile(newProfile)
        }
        .onDisappear {
            store.saveProfile(profile)
        }
        .alert("마루웰", isPresented: $showMessage) {''',
              'dated inspection profile autosave'
          )
          PY

          test -s Maroowell/Resources/maroowell_login_loading4.gif
          test -s Maroowell/Resources/mungyeong_gamhong.ttf
          grep -q 'Text("MAROOWELL")' Maroowell/Home/HomeView.swift
          grep -q 'MaroowellLoadingGIFView' Maroowell/Auth/LoginView.swift
          grep -q 'profile = store.loadProfile()' Maroowell/Inspection/DailyInspectionView.swift

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Maroowell
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Restore wink loading brand font and inspection profile"
          git push origin HEAD:main
