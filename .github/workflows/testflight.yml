name: TestFlight Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: maroowell-testflight
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen imagemagick

      - name: Configure App Store Connect API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          RAW_KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}_raw.p8"
          KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          python3 - <<'PY'
          import os
          from pathlib import Path

          raw = os.environ["APPSTORE_PRIVATE_KEY"].strip()
          raw = raw.replace("\\n", "\n").replace("\r", "")
          raw = raw.strip().strip('"').strip("'").strip()
          if "-----BEGIN PRIVATE KEY-----" not in raw and "-----BEGIN EC PRIVATE KEY-----" not in raw:
              body = "".join(raw.split())
              raw = f"-----BEGIN PRIVATE KEY-----\n{body}\n-----END PRIVATE KEY-----\n"
          elif not raw.endswith("\n"):
              raw += "\n"
          path = Path(os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{os.environ['APPSTORE_KEY_ID']}_raw.p8"))
          path.write_text(raw, encoding="utf-8")
          PY
          chmod 600 "$RAW_KEY_PATH"
          test -s "$RAW_KEY_PATH"
          openssl pkey -in "$RAW_KEY_PATH" -noout >/dev/null
          openssl ec -in "$RAW_KEY_PATH" -out "$KEY_PATH" >/dev/null 2>&1
          chmod 600 "$KEY_PATH"
          test -s "$KEY_PATH"
          openssl ec -in "$KEY_PATH" -check -noout >/dev/null 2>&1
          grep -q '^-----BEGIN EC PRIVATE KEY-----$' "$KEY_PATH"

      - name: Prepare App Store icon and export metadata
        run: |
          set -euo pipefail
          ICON_DIR="Maroowell/Resources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          magick -size 1024x1024 canvas:white \
            -stroke '#C2141C' \
            -strokewidth 82 \
            -fill none \
            -draw "path 'M 120,700 L 120,330 L 315,575 L 505,330 L 505,700'" \
            -draw "path 'M 565,330 L 650,700 L 760,475 L 870,700 L 955,330'" \
            -alpha off \
            "PNG24:$ICON_DIR/AppIcon.png"
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICON_DIR/AppIcon.png"
          cat > "$ICON_DIR/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" Maroowell/Resources/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" Maroowell/Resources/Info.plist

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Maroowell.xcodeproj -scheme Maroowell

      - name: Archive with Xcode cloud signing
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          xcodebuild \
            -project Maroowell.xcodeproj \
            -scheme Maroowell \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Maroowell.xcarchive" \
            -allowProvisioningDeviceRegistration \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DEVELOPMENT_TEAM="V5A6HB9WBY" \
            CODE_SIGN_STYLE="Automatic" \
            ASSETCATALOG_COMPILER_APPICON_NAME="AppIcon" \
            archive

      - name: Export signed IPA
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>V5A6HB9WBY</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          rm -rf "$RUNNER_TEMP/TestFlightExport"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Maroowell.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlightExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          find "$RUNNER_TEMP/TestFlightExport" -maxdepth 2 -name '*.ipa' -print

      - name: Validate and upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/TestFlightExport" -maxdepth 2 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          xcrun altool --validate-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Keep signed IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maroowell-TestFlight-${{ github.run_number }}
          path: ${{ runner.temp }}/TestFlightExport/*.ipa
          retention-days: 7
          if-no-files-found: error
