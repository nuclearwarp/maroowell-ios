name: TestFlight Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: maroowell-testflight
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Configure App Store Connect API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          test -s "$KEY_PATH"

      - name: Prepare App Store icon and export metadata
        run: |
          set -euo pipefail
          ICON_DIR="Maroowell/Resources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          cat > "$RUNNER_TEMP/make_icon.swift" <<'SWIFT'
          import AppKit

          let output = CommandLine.arguments[1]
          let width = 1024
          let height = 1024
          guard let bitmap = NSBitmapImageRep(
              bitmapDataPlanes: nil,
              pixelsWide: width,
              pixelsHigh: height,
              bitsPerSample: 8,
              samplesPerPixel: 3,
              hasAlpha: false,
              isPlanar: false,
              colorSpaceName: .deviceRGB,
              bytesPerRow: 0,
              bitsPerPixel: 0
          ) else { exit(1) }
          guard let context = NSGraphicsContext(bitmapImageRep: bitmap) else { exit(1) }
          NSGraphicsContext.saveGraphicsState()
          NSGraphicsContext.current = context
          NSColor.white.setFill()
          NSRect(x: 0, y: 0, width: width, height: height).fill()
          let paragraph = NSMutableParagraphStyle()
          paragraph.alignment = .center
          let attributes: [NSAttributedString.Key: Any] = [
              .font: NSFont.systemFont(ofSize: 330, weight: .black),
              .foregroundColor: NSColor(calibratedRed: 0.76, green: 0.08, blue: 0.11, alpha: 1.0),
              .paragraphStyle: paragraph
          ]
          "MW".draw(in: NSRect(x: 0, y: 335, width: width, height: 400), withAttributes: attributes)
          NSGraphicsContext.restoreGraphicsState()
          guard let png = bitmap.representation(using: .png, properties: [:]) else { exit(1) }
          try png.write(to: URL(fileURLWithPath: output))
          SWIFT
          swift "$RUNNER_TEMP/make_icon.swift" "$ICON_DIR/AppIcon.png"
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICON_DIR/AppIcon.png"
          cat > "$ICON_DIR/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" Maroowell/Resources/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" Maroowell/Resources/Info.plist

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Maroowell.xcodeproj -scheme Maroowell

      - name: Archive signed iPhone build
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          xcodebuild \
            -project Maroowell.xcodeproj \
            -scheme Maroowell \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Maroowell.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DEVELOPMENT_TEAM="V5A6HB9WBY" \
            ASSETCATALOG_COMPILER_APPICON_NAME="AppIcon" \
            archive

      - name: Export signed IPA
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>V5A6HB9WBY</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          rm -rf "$RUNNER_TEMP/TestFlightExport"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Maroowell.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlightExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          find "$RUNNER_TEMP/TestFlightExport" -maxdepth 2 -name '*.ipa' -print

      - name: Validate and upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/TestFlightExport" -maxdepth 2 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          xcrun altool --validate-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Keep signed IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maroowell-TestFlight-${{ github.run_number }}
          path: ${{ runner.temp }}/TestFlightExport/*.ipa
          retention-days: 7
          if-no-files-found: error
