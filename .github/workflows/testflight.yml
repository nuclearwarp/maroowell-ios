# TestFlight deployment
name: TestFlight Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: maroowell-testflight
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen imagemagick

      - name: Configure App Store Connect API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          RAW_KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}_raw.p8"
          KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["APPSTORE_PRIVATE_KEY"].strip()
          raw = raw.replace("\\n", "\n").replace("\r", "")
          raw = raw.strip().strip('"').strip("'").strip()
          if "-----BEGIN PRIVATE KEY-----" not in raw and "-----BEGIN EC PRIVATE KEY-----" not in raw:
              body = "".join(raw.split())
              raw = f"-----BEGIN PRIVATE KEY-----\n{body}\n-----END PRIVATE KEY-----\n"
          elif not raw.endswith("\n"):
              raw += "\n"
          path = Path(os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{os.environ['APPSTORE_KEY_ID']}_raw.p8"))
          path.write_text(raw, encoding="utf-8")
          PY
          chmod 600 "$RAW_KEY_PATH"
          openssl pkey -in "$RAW_KEY_PATH" -noout >/dev/null
          openssl pkcs8 -topk8 -nocrypt -in "$RAW_KEY_PATH" -out "$KEY_PATH" >/dev/null 2>&1
          chmod 600 "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -noout >/dev/null

      - name: Validate App Store icon and export metadata
        run: |
          set -euo pipefail
          ICON_PATH="Maroowell/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          test -f "$ICON_PATH"
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICON_PATH"
          WIDTH=$(sips -g pixelWidth "$ICON_PATH" | tail -1 | awk '{print $2}')
          HEIGHT=$(sips -g pixelHeight "$ICON_PATH" | tail -1 | awk '{print $2}')
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" Maroowell/Resources/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" Maroowell/Resources/Info.plist

      - name: Prepare Android brand resources
        run: |
          set -euo pipefail
          mkdir -p Maroowell/Resources
          APK="$RUNNER_TEMP/Maroowell-1.4.8.apk"
          curl --fail --location --retry 3 \
            "https://maroowell-app-download.brain-0f6.workers.dev/downloads/Maroowell-1.4.8.apk" \
            -o "$APK"
          GIF_PATH="$(unzip -Z1 "$APK" | grep -E '(^|/)maroowell_login_loading4\.gif$' | head -1)"
          FONT_PATH="$(unzip -Z1 "$APK" | grep -E '(^|/)mungyeong_gamhong\.ttf$' | head -1)"
          test -n "$GIF_PATH"
          test -n "$FONT_PATH"
          unzip -p "$APK" "$GIF_PATH" > Maroowell/Resources/maroowell_login_loading4.gif
          unzip -p "$APK" "$FONT_PATH" > Maroowell/Resources/mungyeong_gamhong.ttf
          file Maroowell/Resources/maroowell_login_loading4.gif
          file Maroowell/Resources/mungyeong_gamhong.ttf
          test -s Maroowell/Resources/maroowell_login_loading4.gif
          test -s Maroowell/Resources/mungyeong_gamhong.ttf

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Maroowell.xcodeproj -scheme Maroowell

      - name: Archive with automatic signing
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          xcodebuild \
            -project Maroowell.xcodeproj \
            -scheme Maroowell \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Maroowell.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

      - name: Export signed IPA
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>V5A6HB9WBY</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          rm -rf "$RUNNER_TEMP/TestFlightExport"
          mkdir -p "$RUNNER_TEMP/TestFlightExport"
          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Maroowell.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlightExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Validate and upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/TestFlightExport" -maxdepth 2 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          echo "IPA: $IPA"
          set +e
          xcrun altool --validate-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/validate.log"
          validate_status=${PIPESTATUS[0]}
          set -e
          if [ "$validate_status" -ne 0 ]; then exit "$validate_status"; fi
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/upload.log"
          upload_status=${PIPESTATUS[0]}
          set -e
          exit "$upload_status"

      - name: Keep TestFlight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-diagnostics-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/validate.log
            ${{ runner.temp }}/upload.log
            ${{ runner.temp }}/ExportOptions.plist
            ${{ runner.temp }}/TestFlightExport/*.ipa
