name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare Android brand resources
        run: |
          set -euo pipefail
          mkdir -p Maroowell/Resources
          APK="$RUNNER_TEMP/Maroowell-1.4.8.apk"
          curl --fail --location --retry 3 \
            "https://maroowell-app-download.brain-0f6.workers.dev/downloads/Maroowell-1.4.8.apk" \
            -o "$APK"
          GIF_PATH="$(unzip -Z1 "$APK" | grep -E '(^|/)maroowell_login_loading4\.gif$' | head -1)"
          FONT_PATH="$(unzip -Z1 "$APK" | grep -E '(^|/)mungyeong_gamhong\.ttf$' | head -1)"
          test -n "$GIF_PATH"
          test -n "$FONT_PATH"
          unzip -p "$APK" "$GIF_PATH" > Maroowell/Resources/maroowell_login_loading4.gif
          unzip -p "$APK" "$FONT_PATH" > Maroowell/Resources/mungyeong_gamhong.ttf
          file Maroowell/Resources/maroowell_login_loading4.gif
          file Maroowell/Resources/mungyeong_gamhong.ttf
          test -s Maroowell/Resources/maroowell_login_loading4.gif
          test -s Maroowell/Resources/mungyeong_gamhong.ttf

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Maroowell.xcodeproj -scheme Maroowell

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Maroowell.xcodeproj \
            -scheme Maroowell \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
