name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare Android brand resources
        run: |
          set -euo pipefail
          mkdir -p Maroowell/Resources
          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/nuclearwarp/maroowell-android/git/blobs/5a3bbea090c6b2ae5088fea2c9e565c790935171" \
            -o Maroowell/Resources/maroowell_login_loading4.gif
          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/nuclearwarp/maroowell-android/git/blobs/ceb6982e1f748467375258bf59bc53d796314134" \
            -o Maroowell/Resources/mungyeong_gamhong.ttf
          file Maroowell/Resources/maroowell_login_loading4.gif
          file Maroowell/Resources/mungyeong_gamhong.ttf
          test -s Maroowell/Resources/maroowell_login_loading4.gif
          test -s Maroowell/Resources/mungyeong_gamhong.ttf

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Maroowell.xcodeproj -scheme Maroowell

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Maroowell.xcodeproj \
            -scheme Maroowell \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
