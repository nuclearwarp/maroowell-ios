name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen apktool

      - name: Prepare Android font resource and verify loading GIF
        run: |
          set -euo pipefail
          mkdir -p Maroowell/Resources
          APK="$RUNNER_TEMP/Maroowell-1.4.8.apk"
          DECODED="$RUNNER_TEMP/maroowell-apk"
          curl --fail --location --retry 3 \
            "https://maroowell-app-download.brain-0f6.workers.dev/downloads/Maroowell-1.4.8.apk" \
            -o "$APK"
          apktool d -f -s "$APK" -o "$DECODED"
          FONT_PATH="$(find "$DECODED/res" -type f -name 'mungyeong_gamhong.*' -print -quit)"
          test -n "$FONT_PATH"
          cp "$FONT_PATH" Maroowell/Resources/mungyeong_gamhong.ttf
          test -s Maroowell/Resources/maroowell_login_loading4.gif
          test -s Maroowell/Resources/mungyeong_gamhong.ttf
          echo "8FD33706F05F24ED5276FF4FA1E65F7C9B09E866F845F20163E1E017981B0B5F  Maroowell/Resources/maroowell_login_loading4.gif" | shasum -a 256 -c -
          file Maroowell/Resources/maroowell_login_loading4.gif
          file Maroowell/Resources/mungyeong_gamhong.ttf

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Maroowell.xcodeproj -scheme Maroowell

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Maroowell.xcodeproj \
            -scheme Maroowell \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
