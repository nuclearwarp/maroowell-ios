name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare Android brand resources
        run: |
          set -euo pipefail
          mkdir -p Maroowell/Resources
          curl -fL "https://raw.githubusercontent.com/nuclearwarp/maroowell-android/main/app/src/main/res/drawable-nodpi/maroowell_login_loading4.gif" -o Maroowell/Resources/maroowell_login_loading4.gif
          curl -fL "https://raw.githubusercontent.com/nuclearwarp/maroowell-android/main/app/src/main/res/font/mungyeong_gamhong.ttf" -o Maroowell/Resources/mungyeong_gamhong.ttf
          test -s Maroowell/Resources/maroowell_login_loading4.gif
          test -s Maroowell/Resources/mungyeong_gamhong.ttf

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Maroowell.xcodeproj -scheme Maroowell

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Maroowell.xcodeproj \
            -scheme Maroowell \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
