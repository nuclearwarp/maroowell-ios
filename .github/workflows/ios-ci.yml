name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare Android brand resources
        run: |
          set -euo pipefail
          mkdir -p Maroowell/Resources
          APK="$RUNNER_TEMP/Maroowell-1.4.8.apk"
          curl --fail --location --retry 3 \
            "https://maroowell-app-download.brain-0f6.workers.dev/downloads/Maroowell-1.4.8.apk" \
            -o "$APK"
          export APK
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          apk = Path(os.environ["APK"])
          out_dir = Path("Maroowell/Resources")
          targets = {
              1_988_072: out_dir / "maroowell_login_loading4.gif",
              751_144: out_dir / "mungyeong_gamhong.ttf",
          }
          found = {}
          with zipfile.ZipFile(apk) as zf:
              for info in zf.infolist():
                  if info.file_size in targets and info.file_size not in found:
                      data = zf.read(info)
                      targets[info.file_size].write_bytes(data)
                      found[info.file_size] = info.filename
          for size, dest in targets.items():
              if size not in found:
                  raise SystemExit(f"APK resource with uncompressed size {size} not found")
              print(f"Extracted {found[size]} -> {dest} ({dest.stat().st_size} bytes)")
          PY
          file Maroowell/Resources/maroowell_login_loading4.gif
          file Maroowell/Resources/mungyeong_gamhong.ttf
          test -s Maroowell/Resources/maroowell_login_loading4.gif
          test -s Maroowell/Resources/mungyeong_gamhong.ttf

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Maroowell.xcodeproj -scheme Maroowell

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Maroowell.xcodeproj \
            -scheme Maroowell \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
