name: Maroowell
options:
  bundleIdPrefix: com.maroowell
  deploymentTarget:
    iOS: "17.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.1

targets:
  Maroowell:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Maroowell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maroowell.app
        PRODUCT_NAME: Maroowell
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        INFOPLIST_FILE: Maroowell/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V5A6HB9WBY
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - package: Supabase
        product: Supabase
